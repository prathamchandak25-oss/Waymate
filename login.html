<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log In | Waymate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Variables --- */
        :root {
            --primary-color: #ffffff; 
            --bg-dark: #050505;
            --text-main: #ffffff;
            --text-muted: #a1a1a1; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            z-index: 0;
        }

        /* --- Animated Background Blobs --- */
        .bg-blobs {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
        }

        .blob-1 {
            top: -20%; left: -20%;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(50, 100, 255, 1) 0%, rgba(0,0,0,0) 70%);
            animation: move1 25s infinite alternate ease-in-out;
        }

        .blob-2 {
            bottom: -20%; right: -20%;
            width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(120, 50, 255, 1) 0%, rgba(0,0,0,0) 70%);
            animation: move2 30s infinite alternate-reverse ease-in-out;
        }

        @keyframes move1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(15%, 10%) scale(1.1); }
        }
        @keyframes move2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-15%, -10%) scale(1.05); }
        }

        /* --- ENHANCED GLASS CARD --- */
        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 50px 40px;
            background: rgba(40, 40, 40, 0.3);
            backdrop-filter: blur(30px) saturate(110%);
            -webkit-backdrop-filter: blur(30px) saturate(110%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top-color: rgba(255, 255, 255, 0.2);
            border-left-color: rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            z-index: 10;
            position: relative;
            text-align: center;
        }

        .brand-header { margin-bottom: 40px; }
        .logo { font-size: 2rem; font-weight: 700; color: white; text-decoration: none; display: inline-block; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .logo span { color: var(--text-muted); font-weight: 300; }
        .welcome-text { color: var(--text-muted); font-size: 0.95rem; }

        /* Google Button Style */
        .btn-google {
            width: 100%;
            padding: 16px;
            background: white;
            color: black;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .btn-google:hover { 
            transform: translateY(-2px); 
            background: #f5f5f5;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .btn-google:active { transform: scale(0.98); }

        .error-msg {
            color: #ff4d4d; font-size: 0.85rem; margin-top: 15px; display: none;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .terms-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 30px;
            line-height: 1.5;
        }
        .terms-text a { color: rgba(255, 255, 255, 0.7); text-decoration: none; }
        .terms-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-card">
        
        <div class="brand-header">
            <a href="index.html" class="logo">WAY<span>MATE</span></a>
            <p class="welcome-text">Sign in to start your journey.</p>
        </div>

        <button id="google-btn" class="btn-google">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
        </button>
        
        <p id="error-message" class="error-msg"></p>

        <p class="terms-text">
            By clicking continue, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </p>

    </div>

    <script type="module">
        // 1. Import Auth Functions
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        // 2. Import 'app' from your new config file
        import { app } from "./firebase-config.js";

        // 3. Initialize Auth using the imported 'app'
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleBtn = document.getElementById('google-btn');
        const errorMsg = document.getElementById('error-message');

        googleBtn.addEventListener('click', () => {
            errorMsg.style.display = 'none';
            
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    console.log("Logged in as: ", user.displayName);
                    // Redirect to home page
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    console.error(error);
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    
                    if (errorCode === 'auth/popup-closed-by-user') {
                        errorMsg.textContent = "Sign-in cancelled.";
                    } else if (errorCode === 'auth/operation-not-allowed') {
                        errorMsg.textContent = "Enable Google Sign-in in Firebase Console.";
                    } else {
                        errorMsg.textContent = errorMessage;
                    }
                    errorMsg.style.display = 'block';
                });
        });
    </script>

</body>
</html>
